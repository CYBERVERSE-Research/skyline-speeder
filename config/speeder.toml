generation = 1
enabled_modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]
# Baseline-framework PRR-style continuous recovery-phase rate limiting (see
# FeatureMask::PRR / bpf/include/skyline_abi.h's SKYLINE_FEATURE_PRR doc comment) --
# NOT one of the M1-M4 ablation modules above: it applies by default even to
# a profile with enabled_modules=[] (e.g. b2-skyline-base), since it fixes a
# baseline-parity bug (cong_control bypasses the kernel's own PRR) rather
# than adding an optional feature. Only exercised on the M2-off path --
# with M2 (adaptive-cwnd) on, skyline_cong_control() bypasses PRR entirely (see
# bpf/skyline_cc.bpf.c's top-of-file comment). Set to false only for rollback/A-B
# comparison against the pre-PRR behavior.
prr_pacing_enabled = true
# Kernel-equivalent pacing-rate ceiling used when M4 (pacing) is off (see
# prr_pacing_enabled's comment -- same rationale, same independent-switch
# shape). Set to false only for rollback/A-B comparison.
auto_pacing_enabled = true
# Congestion control for new connections whenever skyline_cc is not attached:
# every enable writes it before the attach, and `ssctl drain` and the enable
# unit's ExecStop write it on the way out. It must be registered
# (/proc/sys/net/ipv4/tcp_available_congestion_control) or a module tcp_<name>
# the kernel loads when the sysctl is written -- xanmod builds cubic that way.
# install.sh replaces cubic with the algorithm the host's sysctl configuration
# selects at boot (bbr on most VPS images), so detaching leaves the host on
# what it ran: in a config it creates, and on every later run while the value
# is still its own choice. A value set by hand is never rewritten.
fallback_cc = "cubic"
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 70
# Ratio of base RTT added to max_queue_delay_ms to form the actual guardrail
# (max of the two -- see skyline_max_queue_delay_us() in bpf/skyline_cc.bpf.c), so
# the guardrail still widens on higher-RTT paths instead of staying pinned to
# the fixed floor. 70ms / 0.6 replaced 100ms / 1.0 after tuning on a
# production deployment (many concurrent flows, roughly 100-150ms base RTT):
# there the standing queue a flow could build topped out just under the old
# threshold, so the one congestion signal this controller accepts almost
# never fired. 100ms / 1.0 is what docs/04-performance-report.md measured.
max_queue_delay_ratio = 0.6
# Aggressive initial window (see bpf/include/skyline_abi.h's
# initial_cwnd_packets doc comment) -- standard IW10 slow-start takes ~7
# RTTs (2.1s at 300ms RTT) to reach 1000 packets, too slow for the target
# box's high-RTT corner. 0 disables this (falls back to the kernel's own
# initial window).
initial_cwnd_packets = 100
# Floor under M2's BDP-derived cwnd target (see bpf/include/skyline_abi.h's
# min_cwnd_packets doc comment). A thin or app-limited flow's
# bw_bps * base_rtt comes out below a handful of packets, and a window that
# small can only recover from a loss through a tail-loss probe or an RTO.
# It is also where a short response restarts after an RTO: such a flow
# usually never gets a bandwidth estimate, and the kernel leaves it one
# packet. Pacing (M4) still sets the send rate of any flow that has an
# estimate, so raising this does not make one send faster. 32 packets
# (about 46 KB) lets a 15-35 KB response finish in the flight after the
# timeout, and stays under the roughly 44-packet initial receive window of
# a Linux client. Omitting the field gives 4, the floor this project always
# had; must stay within [4, max_cwnd_packets]; only consulted while
# adaptive-cwnd (M2) is on.
min_cwnd_packets = 32

# Every value in these two sections ([adaptive_cwnd] / [loss_classifier]) can be
# overridden at run time with `ssctl set-module-config` / `reset-module-config`,
# without restarting skyline-speederd -- the values here are only the daemon's
# defaults at start, and what is in effect is the `module_tuning` field of
# `ssctl status`.
#
# For the target deployment (10-20% loss, 100-300 ms RTT, tens to hundreds of
# Mbit/s, fairness not a goal): M2 is a two-state machine, STARTUP/CRUISE. While
# it is on it owns cwnd in every CA state (PRR does not take over), and
# cruise_inflight_gain / cruise_pacing_gain are the gains of the CRUISE end
# state. See the comment at the top of bpf/include/skyline_abi.h and
# docs/03-design.md.
#
# The defaults below come from alternating A/B tuning on a production deployment
# (many concurrent connections, base RTT about 100-150 ms, loss mostly from
# congestion rather than purely random), not from the test-bed matrix;
# docs/04-performance-report.md measured the coefficients from before that
# tuning (its section 3.4). Where a link really has 10%-20% purely random loss,
# use the "high random loss" preset in docs/usage.md.
[adaptive_cwnd]
# min-RTT window: the CRUISE gains are always >= 1.0 and there is no drain
# phase, so with too short a window the base RTT takes in the standing queue
# this flow built itself, and the guardrail threshold and the cwnd target drift
# up with it.
min_rtt_window_s = 30
# The bandwidth estimate is the peak of the last few rounds: the longer the
# window, the longer it remembers samples inflated by ACK compression and rates
# from before the bottleneck narrowed, and the easier the pacing rate drifts
# away from what the link delivers now.
bw_window_rtts = 6
# STARTUP exit: this many consecutive rounds of bandwidth growth below
# startup_growth_ratio. Only rounds that put a sample into the bandwidth filter
# count: a round that was application-limited throughout is not "no growth"
# (since 0.5.1; before, a few small responses on a long-lived connection could
# send a flow into CRUISE for good with too low an estimate). A test that fires
# too early does the same.
startup_plateau_rtts = 5
startup_growth_ratio = 0.20
# The single gain of SKYLINE_MODE_STARTUP (shared by the cwnd target and the
# pacing rate).
startup_gain = 3.0
# The cwnd-target gain of SKYLINE_MODE_CRUISE -- deliberately looser than
# cruise_pacing_gain: cwnd only has to stay out of the way, pacing is the real
# limiter. Back at 2.0 on the production deployment, RTO timeouts rose clearly
# (not enough window headroom, so after a loss waiting for the timeout was more
# often the only way left); going up to 4.0 showed no further gain.
cruise_inflight_gain = 3.0
# The pacing-rate gain of SKYLINE_MODE_CRUISE -- the rate limit actually in
# force while M4 is on. CRUISE is the end state and has no periodic probing, so
# the bandwidth estimate can only be refreshed upwards through this > 1.0 gain;
# too low a gain and the estimate climbs slowly. 1.25 was chosen together with
# the tightened loss compensation and guardrail: raising it alone, without
# tightening those two, only adds retransmissions and buys no speed, and going
# higher (1.4) is the same.
cruise_pacing_gain = 1.25
# The gain applied to both the cwnd target and the pacing rate when the
# queue-delay/ECN guardrail trips -- the one real congestion signal Skyline
# Speeder still accepts, so tripping it should not merely "stop accelerating"
# (gain back to 1.0) but actively slow down. 0.8 = down to 80% of the measured
# bandwidth, a starting value still to be validated by small experiments, not a
# value proven optimal; 0.0 means only cancel the acceleration without slowing
# down (gain back to 1.0).
guardrail_gain = 0.8

[loss_classifier]
# M3 is a single loss-rate compensation factor (1/(1-p); see the doc comment of
# skyline_loss_inflation_permille() in bpf/skyline_cc.bpf.c), with no
# multi-way loss classification -- in the target environment "never cut the
# window for a loss" is the right answer. Compensation is capped at 0.10 (at
# most 1.11x): enough to offset the bandwidth underestimate that single-digit
# percentages of random loss cause. Capped higher, it is a positive feedback
# loop on a congestion bottleneck -- the more it loses, the more it compensates,
# the more it sends, the more it loses -- and only the guardrail can break it.
# Where a link really has 10%-20% purely random loss (the environment
# docs/04-performance-report.md measured), set it back to 0.5 (2.0x, covering
# that upper loss bound with headroom for the retransmission overhead).
loss_inflation_max_ratio = 0.10

# [rack_tuning]
# Defaults for the global RACK sysctls. Empty / the whole section left out =
# skyline-speederd does not take them over, and they belong to the experiment
# matrix's infra/apply-guest-profile.sh, per case. Uncommented, skyline-speederd
# writes these values to /proc/sys/net/ipv4/* at start, and a failed write fails
# the daemon's start.
# tcp_recovery = 1        # bitmask; only 1|3|5|7 are valid
# tcp_reordering = 3      # 1..=300
# tcp_early_retrans = 3   # 0..=4

# M1 per-flow dynamic RTO floor (TCP_BPF_RTO_MIN), applied by
# skyline_policy.bpf.c in BPF_SOCK_OPS_RTT_CB. In the target environment faster
# loss detection directly cuts stalls, so it is on here (the experiment matrix
# still overrides it per case with `ssctl set-rack-rto`; see
# config/speeder-guest.toml). The daemon does not send this section at start:
# it takes effect after an `ssctl reset-rack-rto`, after every daemon restart
# alike.
[rack_rto]
enabled = true
srtt_permille = 1100    # target = max(srtt_us, min_rtt_us) * this / 1000
floor_us = 20000        # absolute safety floor (microseconds)
ceiling_us = 200000     # absolute safety ceiling (microseconds), no higher than the kernel's TCP_RTO_MIN = 200 ms
warmup_samples = 4      # the first N RTT samples are only observed, nothing is applied

# TCP_RTO_MAX_MS (the real cap of RTO backoff, ~120 s by kernel default).
# ceiling = clamp(k * base_rtt, 1000 ms, 120000 ms), base_rtt =
# max(srtt_us, min_rtt_us), the same baseline as the RTO_MIN floor above (with
# its guard against min_rtt collapsing to 0 under reordering). On real
# congestion evidence (a new CE mark, or srtt clearly above min_rtt)
# rto_max_congested_permille replaces rto_max_normal_permille -- it never falls
# back to the kernel's 120 s default, it only switches to a larger multiple, and
# the formula always hangs off base_rtt.
# The multiples were set outright: 3x base_rtt without congestion evidence, 6x
# with it -- with no further matrix experiments to pick them; change them if real
# data later shows a need.
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0  # 0 = use the built-in default 2000 (srtt > 2x min_rtt counts as congestion evidence)

# DSCP-mark retransmitted packets, so the network can send them upstream by a
# different path. dscp_value is a placeholder: the actual code point is the
# network side's policy, and a real production value should not be hard-coded
# here, so it is off by default (enabled = false). Carried out by
# bpf/skyline_tc.bpf.c (interface-level TC egress, not per cgroup), it applies
# the same to every TCP flow on runtime.tc_interface, whatever congestion
# control it runs.
[retransmit_dscp]
enabled = false
dscp_value = 0

# First-flight redundancy. While skyline_cc is enabled, bpf/skyline_tc.bpf.c
# (TC egress on runtime.tc_interface) sends every SYN-ACK, every SYN of a
# skyline_cc socket and every segment that starts within the first first_kib
# KiB a skyline_cc connection sends twice: the original at once, a copy
# delay_ms later. On a lossy path a short response spends most of its time
# waiting for loss recovery -- a tail-loss probe after about two RTTs, an RTO
# after about three, the kernel's fixed one-second SYN-ACK timeout -- and a
# late second copy turns most of those losses into a delay of delay_ms. The
# price: a response that fits in first_kib is sent twice; a bulk transfer
# pays for its first first_kib only. The copy is held back by the fq qdisc
# (kept at the root by [guard]); two copies a few milliseconds apart are lost
# together far less often than two back to back (delay_ms = 0). Data segments
# and SYNs of connections that do not run skyline_cc are never copied; a
# SYN-ACK is, whatever its connection will run, since it leaves before the
# connection has a congestion control. Nothing is copied before
# `ssctl enable` or after `ssctl drain`. Omitting the table keeps it on with
# these values; `ssctl set-redundancy` / `reset-redundancy` change it live.
[redundancy]
enabled = true
first_kib = 64   # 1..=1024
delay_ms = 10    # 0..=100

# While skyline_cc is enabled, skyline-speederd re-checks every interval_s
# seconds that the host default congestion control is still skyline_cc and (if
# qdisc = true) that net.core.default_qdisc and the root qdisc of
# runtime.tc_interface are still fq, and puts back whatever something else
# changed -- a `sysctl --system` that re-applies a "one-click BBR" file, a tc
# command that installs cake/fq_pie. `ssctl enable` applies all of it once
# regardless. 0 turns the periodic re-check off. A root qdisc that looks built
# on purpose (htb, tbf, netem, prio, mqprio, a cake with a bandwidth, ...) is
# left alone and reported under "guard" in `ssctl status`; `ssctl drain` stops
# the guard. When runtime.tc_interface is a VLAN, bond or bridge (root noqueue,
# the kernel default there), the NICs under it are checked instead -- never a
# VM's tap or a container's veth.
[guard]
interval_s = 5
# false leaves every qdisc alone (skyline-speederd then owns only the
# congestion control).
qdisc = true

[runtime]
bpf_dir = "build/bpf"
pin_dir = "/sys/fs/bpf/skyline-speeder"
cgroup_path = "/sys/fs/cgroup/skyline-speeder"
socket_path = "/run/skyline-speeder/speeder.sock"
state_path = "/run/skyline-speeder/state.json"
events_path = "/run/skyline-speeder/events.jsonl"
# /run is a RAM-backed tmpfs shared with the rest of the host. Past this many
# MiB the event log is rotated to events.jsonl.1 (one old file kept), so it
# never holds much more than twice this. 0 turns the event log off.
events_max_mib = 8
tc_interface = "data0"
