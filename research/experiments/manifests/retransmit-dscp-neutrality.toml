# Retransmitted-packet DSCP marking: neutrality/overhead comparison. The other half of the same
# requirement as retransmit-dscp-mechanism.toml: that one verifies "whether the marking is
# right", this one verifies "whether turning the marking on drags down throughput/CPU".
#
# The A/B has only one variable: retransmit_dscp.enabled (identical to b1-controlled-cubic,
# no other field touched). Two scenarios:
#   - retransmit-neutrality-baseline: moderate loss, standard duration/sample count (not the short
#     samples of a mechanism validation), a standard neutrality comparison.
#   - retransmit-neutrality-highloss: a higher loss rate. The skb_ensure_writable/pskb_expand_head
#     triggered by `bpf_skb_store_bytes` only happen on packets that are actually
#     marked, so a low-loss scenario cannot measure this cost; a high-loss scenario needs to be covered once specifically to confirm there is
#     no unexpected overhead regression.
#
# Packet capture is off throughout this manifest (capture_retransmits defaults to false):
# tcpdump consumes real CPU on the sender and would directly pollute the
# mean_sender_cpu_pct/perf stat counters compared here; mechanism correctness has already been verified in
# retransmit-dscp-mechanism.toml, so this looks only at performance.
name = "retransmit-dscp-neutrality"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260808
warmup_s = 15
duration_s = 30
runs = 3
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b1-dscp-on"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[profiles.retransmit_dscp]
enabled = true
dscp_value = 10

[[profiles]]
id = "b1-dscp-off"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[profiles.retransmit_dscp]
enabled = false
dscp_value = 0

[[scenarios]]
id = "retransmit-neutrality-baseline"
rtt_ms = 100
rate_mbit = 100
queue_bdp = 1.0
loss_model = "random"
loss_pct = 2.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"

[[scenarios]]
id = "retransmit-neutrality-highloss"
rtt_ms = 100
rate_mbit = 50
queue_bdp = 1.0
loss_model = "random"
loss_pct = 15.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
