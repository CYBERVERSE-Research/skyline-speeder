# Retransmitted-packet DSCP marking: mechanism validation (the network side sends traffic to different upstreams by DSCP; the Skyline Speeder side
# is only responsible for marking "this is a retransmitted packet" in the IP header correctly and configurably; whether the network side really
# splits traffic by DSCP is outside the scope of this test).
#
# The detection mechanism is self-contained in bpf/skyline_tc.bpf.c (it compares the packet's own TCP end_seq with
# bpf_tcp_sock(sk)->snd_nxt), attached at the interface level, not per cgroup, and regardless of which congestion
# control is running. The core validation point of this manifest is "the marking mechanism works consistently for all four
# CCs b0/b1/bbr/skyline", not yet another round of CC performance comparison, so runs=1 (like
# rto-max-smoke.toml, it is a mechanism smoke validation and does not seek statistical confidence).
#
# Four case groups:
#   (a) Mechanism validation: 4 profiles turn on marking in the same real-loss scenario; packet capture checks
#       that everything marked is a real retransmission (the sender-side capture precision threshold) + the BPF built-in counters (the main
#       oracle).
#   (b) Zero-loss negative control: the same profiles moved to a netem 0% loss scenario, with marking on.
#       Measured, the "marked count" here is **not** 0: the HTB rate limiter (queue_bdp=1.0, a shallow queue)
#       tail-drops when achievable throughput exceeds rate_mbit, which is another real loss source independent of netem,
#       and it triggers real retransmissions just the same. What this scenario tests is not "zero retransmissions" but
#       "without active netem loss, the precision threshold (sender-side capture reconstruction) still gives
#       false_positives=0", which makes it a harder negative control than expected: with far more real retransmissions than
#       expected, the marking logic still marked nothing wrongly.
#   (c) Feature-off control: the same loss scenario as (a), with only retransmit_dscp.enabled
#       switched to false, proving that the switch really controls the behaviour (compare (a) and (c) across cases
#       using the BPF built-in counters: in (a) retransmits_detected/marked are both non-zero, in (c)
#       both should be 0; detection happens after the config map lookup, and when disabled it returns early
#       without parsing the packet).
#   (d) DSCP value tracking control: the same loss scenario, two different dscp_values (10 and
#       46), proving that the "placeholder parameter" really is configurable, not something that looks configurable but is actually hard-coded.
#
# All four groups share the same loss scenario (rtt_ms=100/rate_mbit=50/loss_pct=5%,
# offload=off ensures independent random per-packet loss and captures undisturbed by GSO superframes); only (b) switches
# to the zero-loss scenario.
#
# A known difference in what is counted (not a marking error): in analyze_results.py, retransmit_marked
# (BPF side, counted once per skb) and retransmit_capture_marked (sender-side capture, counting the actual packets
# on the wire) are not equal in high-throughput cases (especially skyline-best); the former is clearly
# smaller. Even with offload=off and tso/gso/gro confirmed all off, tc_stats.gso_packets
# still has a non-zero delta, while the packet lengths in the capture are all MTU (1500B). The cause has been found: TCP builds
# large GSO frames first no matter how the NIC offloads are set (sk_setup_caps() adds NETIF_F_GSO to every TCP socket),
# and they are segmented in software only when they leave the qdisc for the NIC (validate_xmit_skb()),
# while the TC hook runs before segmentation; where BPF counts one skb, there really is more than one packet on the wire,
# so retransmit_marked is systematically smaller than retransmit_capture_marked (every segmented
# packet carries the rewritten DSCP). **retransmit_capture_marked is the authoritative basis for
# marking correctness** (the sender-side capture looks directly at the wire); false_positives is 0 in all
# of these five case groups, and the marking mechanism itself has no problem. NetEm on the router receives the segmented packets, so
# with offload=off the loss really is independent per packet; see section 2.3 of docs/04-performance-report.md.
name = "retransmit-dscp-mechanism"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260807
warmup_s = 3
duration_s = 8
runs = 1
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b0-stock-cubic"
kind = "stock-cubic"
cc = "cubic"
modules = []

[profiles.retransmit_dscp]
enabled = true
dscp_value = 10

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[profiles.retransmit_dscp]
enabled = true
dscp_value = 10

[[profiles]]
id = "bbr-fq"
kind = "bbr"
cc = "bbr"
modules = []

[profiles.retransmit_dscp]
enabled = true
dscp_value = 10

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[profiles.retransmit_dscp]
enabled = true
dscp_value = 10

# Used for (c): the feature-off control. Identical to bbr-fq; only retransmit_dscp.enabled
# is switched to false. There is no need to repeat the off control for all 4 CCs: the detection logic lives entirely in
# skyline_tc.bpf.c and does not depend on which CC is running; (a) already proved "works consistently for the 4
# CCs", so here it only needs to be proved once that "turning the switch off really stops the marking".
[[profiles]]
id = "bbr-fq-dscp-off"
kind = "bbr"
cc = "bbr"
modules = []

[profiles.retransmit_dscp]
enabled = false
dscp_value = 0

# Used for (d): the second value of the DSCP value tracking control (compared with the dscp_value=10 of bbr-fq
# above).
[[profiles]]
id = "bbr-fq-dscp46"
kind = "bbr"
cc = "bbr"
modules = []

[profiles.retransmit_dscp]
enabled = true
dscp_value = 46

# Shared by (a)(c)(d): moderate loss; offload=off ensures independent random per-packet loss + captures undisturbed by
# GSO superframes; short warmup/duration: a mechanism validation is not a statistical experiment.
[[scenarios]]
id = "retransmit-mechanism"
rtt_ms = 100
rate_mbit = 50
queue_bdp = 1.0
loss_model = "random"
loss_pct = 5.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
capture_retransmits = true

# (b): zero-loss (at the netem level) negative control. See the header comment above: HTB tail drops still
# produce real retransmissions; what this scenario validates is that "the precision threshold still holds with a non-netem loss source".
[[scenarios]]
id = "retransmit-zero-loss"
rtt_ms = 20
rate_mbit = 100
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
capture_retransmits = true
