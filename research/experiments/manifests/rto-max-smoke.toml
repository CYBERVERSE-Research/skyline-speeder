# M1 tier-2 TCP_RTO_MAX_MS cap adjustment: mechanism + directional smoke test.
#
# The multipliers (3x base_rtt without congestion evidence, 6x with it) were set directly; no more matrix
# experiments are run to compare candidate values. This manifest only verifies that the mechanism works end to end and points the right way; it does not
# seek a statistically confident "optimal value" conclusion, so runs=1 makes the CV threshold drop out automatically.
#
# The key constraint of the scenario design: a real RTO timeout requires every packet in a whole flight window to be lost
# (otherwise RACK's reordering-window inference handles them first as fast retransmissions, and the RTO
# timer never gets a turn), so ordinary i.i.d. random loss can hardly trigger it reliably in scenarios with
# hundreds of packets in flight. That is also why the forced-rto-burst scenario deliberately uses low bandwidth (to shrink the flight
# window) + the Gilbert-Elliott burst loss model (burst_length deliberately set larger than a full window's
# flight, so the bad state reliably lasts longer than a whole RTT) instead of raising the random loss rate.
# offload=off is required: with GSO on, a single netem drop cuts a whole GSO superframe,
# breaking the meaning of "220 consecutive packets".
#
# rtt200-loss15 is a point copied verbatim from target-box.toml (i.i.d.
# random loss, not bursts), as a regression check that "the recovery behaviour of normal scenarios was not broken";
# real RTO events should be rare in this kind of scenario anyway, so rtomax-off/rtomax-on should show essentially
# no observable difference here.
name = "rto-max-smoke"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260805
warmup_s = 5
duration_s = 20
runs = 1
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "rtomax-off"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 0
rto_max_congested_permille = 0
rto_max_congestion_ratio_permille = 0

[[profiles]]
id = "rtomax-on"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[scenarios]]
id = "forced-rto-burst"
rtt_ms = 150
rate_mbit = 15
queue_bdp = 1.0
loss_model = "gemodel"
loss_pct = 8.0
loss_direction = "data"
burst_length = 220
parallel = 1
offload = "off"

[[scenarios]]
id = "rtt200-loss15"
rtt_ms = 200
rate_mbit = 100
queue_bdp = 1.0
loss_model = "random"
loss_pct = 15.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
