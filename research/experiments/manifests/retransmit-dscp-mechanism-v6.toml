# Retransmitted-packet DSCP marking: IPv6 mechanism validation. The dual-stack twin of the same validation as
# retransmit-dscp-mechanism.toml: the profile definitions are copied verbatim (CC/modules have nothing to do with the address
# family, and neither does the detection logic itself; see skyline_parse_ipv6() in bpf/skyline_tc.bpf.c); the only
# difference is that both scenarios add address_family = "v6", and the manifest level has one more field,
# server_data_ip6. For the full explanation of the principles (what each of the four case groups verifies, and
# the difference in what retransmit_marked and retransmit_capture_marked count), see
# the header comment of retransmit-dscp-mechanism.toml; it is not repeated here.
#
# Validation points specific to IPv6 (which the v4 version cannot measure):
#   - whether the extension-header walk/DSCP read-write path of skyline_parse_ipv6() is itself correct: already verified through a separate
#     spike (packets constructed with bpftool prog run) and real packet captures; this manifest
#     is an end-to-end integration validation, not a redo of the spike.
#   - the behaviour under real traffic of the two new counters ipv6_marked/ipv6_chain_bailout in
#     retransmit_dscp.stats (marked should grow with real retransmissions; bailout should stay near
#     the baseline of "non-TCP background traffic" and should not spike abnormally; see the comment on
#     ipv6_chain_bailout in skyline_abi.h).
#   - the IPv6 tcpdump single-line format parser in analyze_results.py (structured differently from IPv4's
#     two-line header+indented format; already verified with real capture samples, see the
#     *_ipv6 tests in research/experiments/tests/test_analysis.py).
#
# Addresses: the fd20:1::/64 (server side) / fd20:2::/64
# (client side) ULA addressing of infra/topology.sh, corresponding one to one to IPv4's 10.20.1.0/24 / 10.20.2.0/24.
name = "retransmit-dscp-mechanism-v6"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260807
warmup_s = 3
duration_s = 8
runs = 1
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_ip6 = "fd20:1::2"
server_data_interface = "data0"

[[profiles]]
id = "b0-stock-cubic"
kind = "stock-cubic"
cc = "cubic"
modules = []

[profiles.retransmit_dscp]
enabled = true
dscp_value = 10

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[profiles.retransmit_dscp]
enabled = true
dscp_value = 10

[[profiles]]
id = "bbr-fq"
kind = "bbr"
cc = "bbr"
modules = []

[profiles.retransmit_dscp]
enabled = true
dscp_value = 10

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[profiles.retransmit_dscp]
enabled = true
dscp_value = 10

# Used as the off control. Identical to bbr-fq; only retransmit_dscp.enabled is switched to
# false. Same reason as in the v4 version: it only needs to prove once that "turning the switch off really stops the marking".
[[profiles]]
id = "bbr-fq-dscp-off"
kind = "bbr"
cc = "bbr"
modules = []

[profiles.retransmit_dscp]
enabled = false
dscp_value = 0

# A second value, used as the control for tracking the DSCP value.
[[profiles]]
id = "bbr-fq-dscp46"
kind = "bbr"
cc = "bbr"
modules = []

[profiles.retransmit_dscp]
enabled = true
dscp_value = 46

[[scenarios]]
id = "retransmit-mechanism-v6"
rtt_ms = 100
rate_mbit = 50
queue_bdp = 1.0
loss_model = "random"
loss_pct = 5.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
capture_retransmits = true
address_family = "v6"

[[scenarios]]
id = "retransmit-zero-loss-v6"
rtt_ms = 20
rate_mbit = 100
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
capture_retransmits = true
address_family = "v6"
