# Minimal correctness smoke test: not about performance. See the comment at the top of bpf/include/skyline_abi.h:
# M2 is a two-state STARTUP/CRUISE state machine that, when on, directly owns cwnd in every CA state
# (bypassing PRR); ssthresh never reduces the window for M2; M3 is a single loss-rate compensation coefficient.
#
# Acceptance points (checked by hand after the run, not asserted in this manifest):
# - ssctl status shows the current abi_version and the coefficient fields (cruise_inflight_gain etc.)
# - the state of SKYLINE_EVENT_STATE in skyline-events.jsonl only ever shows 0/1 (STARTUP/CRUISE)
# - metrics.prr_adjustments == 0 (proving that the M2 path really bypasses PRR)
# - metrics.guardrail_hits is far below metrics.guardrail_rounds (the guardrail does not fire every round)
#
# rtt200-loss15 (the target box's centre point) × {b1, skyline-best} × runs=1, 2 cases, ~10 minutes.
name = "smoke"
execution_class = "formal-kvm"
performance_valid = true
seed = 20261210
warmup_s = 15
duration_s = 30
runs = 1
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.5
cruise_pacing_gain = 1.25
loss_inflation_max_ratio = 0.5

[[scenarios]]
id = "rtt200-loss15"
rtt_ms = 200
rate_mbit = 100
queue_bdp = 1.0
loss_model = "random"
loss_pct = 15.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
