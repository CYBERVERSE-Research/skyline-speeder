# The full 9-point target box grid: covers b0-stock-cubic (the truly unmodified kernel default:
# fq_codel + default sysctls) and a truly activated M1 tier-2 rack_rto.
#
# skyline-best explicitly carries [profiles.rack_rto] (enabled=true, matching the
# shipped defaults of config/speeder.toml: srtt_permille=1100/floor_us=20000/
# ceiling_us=200000/warmup_samples=4/rto_max_normal_permille=3000/
# rto_max_congested_permille=6000), and module_config explicitly writes every field (including
# guardrail_gain=0.8, not relying on the script's defaults).
#
# 5 profiles (b0/b1/bbr-fq/b2-skyline-base/skyline-best) × 9 scenarios (rtt{100,200,300}
# × loss{10,15,20}%, rate_mbit=100, offload=off) × runs=2 = 90 cases,
# ~75-90 minutes.
#
# Acceptance: primary criterion median(skyline-best) >= 1.05 * max(median(b0), median(b1),
# median(bbr)); robustness criterion min_over_runs(skyline-best) >
# max_over_runs(baseline) (BBR has a bimodal distribution at some points, and with n=2 its median is an unstable
# threshold, so this uses "the minimum is still above any maximum the other side ever produced", a criterion
# not affected by sampling luck). Points that miss are recorded as they are: not hidden, and not rerun to cherry-pick data so that some item passes.
name = "target-box"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260806
warmup_s = 12
duration_s = 25
runs = 2
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b0-stock-cubic"
kind = "stock-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "bbr-fq"
kind = "bbr"
cc = "bbr"
modules = []

[[profiles]]
id = "b2-skyline-base"
kind = "skyline"
cc = "skyline_cc"
modules = []

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[scenarios]]
id = "rtt100-loss10"
rtt_ms = 100
rate_mbit = 100
queue_bdp = 1.0
loss_model = "random"
loss_pct = 10.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"

