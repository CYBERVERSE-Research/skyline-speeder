# 链路状况波动场景——用到 Segment（单个 case 内实时切换链路参数）能力，
# 覆盖两个目标环境网格覆盖不到的点：
#
# 1. 目标环境网格里 RTT/带宽/丢包率在单个 case 内全程固定，没有任何场景
#    模拟"链路状况在测试过程中变化"（移动网络切换基站、链路拥塞来了又走）。
# 2. M1 tier-2 rto_max 的"拥塞证据"分支（rack_rto_max_congested 计数器）
#    在其它 manifest 里经常非零，但这个计数器只反映"每次 RTT 回调时证据
#    是否成立"，从没有一次专门验证过"6x 档在一次真实 RTO 超时事件发生的
#    同一时刻确实生效"。
#
# 场景设计：先让排队时延真实涨起来（不掺丢包，让证据干净地立住），再在证
# 据已经成立的窗口内叠加一次真实丢包突发（逼一次真实 RTO），时间窗口上跟
# "拥塞证据"重叠，比任何静态场景更有把握同时验证这两件事。
#
# 关键实现约束（都已在 infra/configure-path.sh 手工验证过，不是假设）：
# - 排队时延 = queue_bdp × rtt_ms，跟 rate_mbit 无关（QUEUE_PACKETS 的推导
#   公式代入化简后 rate 项直接消掉）——单纯把带宽从 100 降到 15 Mbit 不会
#   让排队时延变化，必须把 segment 1/2 的 queue_packets 锁定在骤降前的绝
#   对值（2500，= 100Mbit×300ms×1.0 BDP 的推导结果），让同样的包数在更低
#   带宽下排更久的队。
# - segment 用 `tc ... change`（不是 replace）热更新，不中断连接、不清零
#   qdisc 计数器；每次热更新内核都会重置 netem 的丢包 PRNG，所以每个
#   segment 用独立派生的种子（case.seed + 1_000_000×index，run_matrix.py
#   自动处理，manifest 不需要关心）。
# - segment 2 的丢包突发复用 rto-max-validation.toml 已验证安全的参数
#   （burst_length=220，短窗口），不用更激进的组合——更大的 burst_length/
#   duration_s 会让没有 rack_rto 上限的 profile 大概率触发内核
#   rto_max=120s×retries2=15 级联超时死循环。
#
# Segment 时间线（offset_s 相对 client 进程启动，含 warmup）：
#   [0, 20)   segment 0（scenario 本身）：rate=100Mbit，queue=1.0 BDP
#             (≈2500 包)，loss=gemodel 0.5%——平稳基线，建立 min_rtt。
#   [20, 35)  segment 1：rate 骤降到 15Mbit，queue_packets 锁定 2500（不
#             随新带宽重算）——2500 包在 15Mbit 下排队时延≈2s，
#             srtt/min_rtt 比值可达 ~7-8x，远超 tier-2 默认 2x 门槛；本意是这一
#             段不引入丢包，让排队证据先干净地立住，也给 Skyline Speeder 自己的
#             10s 窗口 base_rtt（M2 护栏用）留时间往上飘、跟内核 min_rtt
#             （tier-2 用，窗口长得多）产生"护栏放松但 tier-2 仍判定拥塞"
#             的错位（这正是能观察到真实效果的窗口，不是缺陷）。注意：下面
#             这一段的配置——也就是实际跑过的条件——仍是 0.5% gemodel 丢包。
#   [35, 43)  segment 2：rate/queue 不变，loss 换成 gemodel 8%（复用已验
#             证安全的 burst_length=220）——在已经成立的排队证据上叠加一
#             次真实丢包突发，逼一次真实 RTO。
#   [43, 59)  segment 3：恢复 rate=100Mbit/queue 默认推导/loss=0.5%——4 个
#             profile 真正可比的吞吐/恢复速度落在这一段。
#
# Profile：b0/b1/bbr-fq 是硬性对照要求（用户明确要求跟默认 CUBIC/BBR 比）；
# skyline-best 是本轮真正的测试对象；skyline-relaxed-congestion-ratio 跟 skyline-best
# 唯一差异是 rack_rto.rto_max_congestion_ratio_permille=1500（默认走
# BPF 侧 SKYLINE_RTO_MAX_DEFAULT_CONGESTION_RATIO_PERMILLE=2000‰=2x，这里放宽
# 到 1.5x）——如果 skyline-best 那份还是测不到 congested 分支，靠这份 A/B 隔离
# "测试床做不出足够的排队时延"和"阈值刚好卡在 M2 护栏自己防守的同一个数值
# 上"这两种可能，零新代码，复用现有字段。
#
# 5 profile × 1 场景 × runs=3 = 15 case。首次执行按"排查跑"对待：先
# runs=1 跑一遍确认没有级联超时、segment-timeline.json 记录的切换时间点符
# 合预期，再补到 runs=3。
name = "volatile-link"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260813
warmup_s = 5
duration_s = 54
runs = 3
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b0-stock-cubic"
kind = "stock-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "bbr-fq"
kind = "bbr"
cc = "bbr"
modules = []

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[profiles]]
id = "skyline-relaxed-congestion-ratio"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 1500

[[scenarios]]
id = "volatile-bandwidth-cliff"
rtt_ms = 300
rate_mbit = 100
queue_bdp = 1.0
loss_model = "gemodel"
loss_pct = 0.5
loss_direction = "data"
burst_length = 220
parallel = 1
offload = "off"

[[scenarios.segments]]
offset_s = 20.0
rtt_ms = 300
rate_mbit = 15
loss_model = "gemodel"
loss_pct = 0.5
loss_direction = "data"
burst_length = 220
queue_packets = 2500
label = "cliff-queue-build"

[[scenarios.segments]]
offset_s = 35.0
rtt_ms = 300
rate_mbit = 15
loss_model = "gemodel"
loss_pct = 8.0
loss_direction = "data"
burst_length = 220
queue_packets = 2500
label = "cliff-loss-burst"

[[scenarios.segments]]
offset_s = 43.0
rtt_ms = 300
rate_mbit = 100
loss_model = "gemodel"
loss_pct = 0.5
loss_direction = "data"
burst_length = 220
label = "recovery"
