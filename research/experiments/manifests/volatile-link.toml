# Link volatility scenario: uses the Segment capability (switching link parameters live within a single case),
# covering two points that the target environment grid cannot cover:
#
# 1. In the target environment grid, RTT/bandwidth/loss rate are fixed for the whole of a single case; no scenario
#    simulates "link conditions changing during the test" (a mobile network switching base stations, link congestion coming and going).
# 2. The "congestion evidence" branch of M1 tier-2 rto_max (the rack_rto_max_congested counter)
#    is often non-zero in other manifests, but this counter only reflects "whether the evidence held at each RTT
#    callback"; it has never once been specifically verified that "the 6x level really takes effect at the same moment
#    a real RTO timeout event happens".
#
# Scenario design: first let the queueing delay really rise (no loss mixed in, so the evidence is established cleanly), then, within the window
# where the evidence already holds, superimpose one real loss burst (forcing one real RTO), overlapping in time with
# the "congestion evidence"; this is more certain than any static scenario to verify both things at once.
#
# Key implementation constraints (all verified by hand in infra/configure-path.sh, not assumptions):
# - Queueing delay = queue_bdp × rtt_ms, independent of rate_mbit (after substituting and simplifying the formula that derives
#   QUEUE_PACKETS, the rate term cancels out): merely lowering the bandwidth from 100 to 15 Mbit does not
#   change the queueing delay; the queue_packets of segments 1/2 must be locked at the absolute value before the drop
#   (2500, = the derived result for 100Mbit×300ms×1.0 BDP), so the same number of packets queues longer at the lower
#   bandwidth.
# - Segments are hot-updated with `tc ... change` (not replace), which does not interrupt the connection or zero the
#   qdisc counters; every hot update makes the kernel reset netem's loss PRNG, so each
#   segment uses an independently derived seed (case.seed + 1_000_000×index, handled automatically by run_matrix.py;
#   the manifest need not care).
# - The loss burst of segment 2 reuses the parameters already verified as safe in rto-max-validation.toml
#   (burst_length=220, a short window), not a more aggressive combination: a larger burst_length/
#   duration_s would very likely make profiles without a rack_rto cap trigger the kernel's
#   rto_max=120s×retries2=15 cascading-timeout loop.
#
# Segment timeline (offset_s relative to the start of the client process, including warmup):
#   [0, 20)   segment 0 (the scenario itself): rate=100Mbit, queue=1.0 BDP
#             (≈2500 packets), loss=gemodel 0.5%: a steady baseline that establishes min_rtt.
#   [20, 35)  segment 1: rate drops sharply to 15Mbit, queue_packets locked at 2500 (not
#             recomputed for the new bandwidth): 2500 packets at 15Mbit give a queueing delay of ≈2s,
#             and the srtt/min_rtt ratio can reach ~7-8x, far above the tier-2 default 2x threshold; the intent is that this
#             segment introduces no loss, so the queueing evidence is established cleanly first, and that Skyline Speeder's own
#             10s-window base_rtt (used by the M2 guardrail) has time to drift upward and diverge from the kernel's min_rtt
#             (used by tier-2, with a much longer window), producing a "guardrail relaxes but tier-2 still judges congestion"
#             mismatch (this is exactly the window where a real effect can be observed, not a defect). Note: the configuration of
#             this segment below, i.e. the condition that was actually run, still has 0.5% gemodel loss.
#   [35, 43)  segment 2: rate/queue unchanged, loss switched to gemodel 8% (reusing the burst_length=220
#             already verified as safe): superimposes one real loss burst on the queueing evidence that
#             already holds, forcing one real RTO.
#   [43, 59)  segment 3: restores rate=100Mbit/the default derived queue/loss=0.5%: the truly comparable throughput/recovery
#             speed of the 4 profiles falls in this segment.
#
# Profiles: b0/b1/bbr-fq are a hard control requirement (the user explicitly asked for a comparison with the default CUBIC/BBR);
# skyline-best is the real test subject of this round; skyline-relaxed-congestion-ratio differs from skyline-best
# only in rack_rto.rto_max_congestion_ratio_permille=1500 (the default goes to
# SKYLINE_RTO_MAX_DEFAULT_CONGESTION_RATIO_PERMILLE=2000‰=2x on the BPF side; here it is relaxed
# to 1.5x): if the skyline-best one still cannot reach the congested branch, this A/B isolates the two possibilities
# "the test bed cannot produce enough queueing delay" and "the threshold sits exactly on the same value that the M2 guardrail
# itself defends", with zero new code, reusing existing fields.
#
# 5 profiles × 1 scenario × runs=3 = 15 cases. The first execution is treated as a "diagnostic run": first
# run once with runs=1 to confirm there is no cascading timeout and the switch times recorded in segment-timeline.json match
# expectations, then fill up to runs=3.
name = "volatile-link"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260813
warmup_s = 5
duration_s = 54
runs = 3
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b0-stock-cubic"
kind = "stock-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "bbr-fq"
kind = "bbr"
cc = "bbr"
modules = []

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[profiles]]
id = "skyline-relaxed-congestion-ratio"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 1500

[[scenarios]]
id = "volatile-bandwidth-cliff"
rtt_ms = 300
rate_mbit = 100
queue_bdp = 1.0
loss_model = "gemodel"
loss_pct = 0.5
loss_direction = "data"
burst_length = 220
parallel = 1
offload = "off"

[[scenarios.segments]]
offset_s = 20.0
rtt_ms = 300
rate_mbit = 15
loss_model = "gemodel"
loss_pct = 0.5
loss_direction = "data"
burst_length = 220
queue_packets = 2500
label = "cliff-queue-build"

[[scenarios.segments]]
offset_s = 35.0
rtt_ms = 300
rate_mbit = 15
loss_model = "gemodel"
loss_pct = 8.0
loss_direction = "data"
burst_length = 220
queue_packets = 2500
label = "cliff-loss-burst"

[[scenarios.segments]]
offset_s = 43.0
rtt_ms = 300
rate_mbit = 100
loss_model = "gemodel"
loss_pct = 0.5
loss_direction = "data"
burst_length = 220
label = "recovery"
