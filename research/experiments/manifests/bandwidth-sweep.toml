# Bandwidth sensitivity: 4 profiles (b0-stock-cubic/b1-controlled-cubic/bbr-fq/
# skyline-best, where skyline-best carries rack_rto+guardrail_gain as in target-box.toml) ×
# rate_mbit ∈ {10,20,30,60,100} at rtt200-loss15 × runs=2 = 40 cases,
# ~40 minutes. The low-bandwidth end points (10/20 Mbit) cover the boundary where initial_cwnd_packets=100 may
# directly exceed the BDP: a real-world constraint on how IW interacts with the guardrail.
#
# No numeric pass/fail threshold is set; the only requirement is to report honestly the trends of the 4 profiles over the 5 bandwidth
# points. "Hundreds of Mbps" is still an extrapolation, and this only covers up to 100Mbit (the structural ceiling of the offload=off
# test bed).
name = "bandwidth-sweep"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260808
warmup_s = 15
duration_s = 30
runs = 2
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b0-stock-cubic"
kind = "stock-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "bbr-fq"
kind = "bbr"
cc = "bbr"
modules = []

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[scenarios]]
id = "rtt200-loss15-bw10"
rtt_ms = 200
rate_mbit = 10
queue_bdp = 1.0
loss_model = "random"
loss_pct = 15.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"

[[scenarios]]
id = "rtt200-loss15-bw20"
rtt_ms = 200
rate_mbit = 20
queue_bdp = 1.0
loss_model = "random"
loss_pct = 15.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"

[[scenarios]]
id = "rtt200-loss15-bw30"
rtt_ms = 200
rate_mbit = 30
queue_bdp = 1.0
loss_model = "random"
loss_pct = 15.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"

[[scenarios]]
id = "rtt200-loss15-bw60"
rtt_ms = 200
rate_mbit = 60
queue_bdp = 1.0
loss_model = "random"
loss_pct = 15.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"

[[scenarios]]
id = "rtt200-loss15-bw100"
rtt_ms = 200
rate_mbit = 100
queue_bdp = 1.0
loss_model = "random"
loss_pct = 15.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
