# Scenarios where the guardrail really takes effect + guardrail_gain A/B. In the target box grid the guardrail
# hardly fires at all, so this manifest picks the 7 scenarios where the guardrail does fire often, for targeted validation
# (run separately on demand, not part of the default regression matrix):
#   intercontinental-clean, reorder-dsack, burst-loss, light-loss,
#   primary, heavy-loss, line-rate
#
# skyline-guardrail-neutral is identical to skyline-best except that guardrail_gain is set back to
# 0.0 (clamped to a neutral 1.0, no active slowdown); skyline-best minus skyline-guardrail-neutral
# is the marginal effect of this coefficient itself. intercontinental-clean (0% loss/
# 400ms RTT/1000Mbit clean control scenario) carries the highest risk: the guardrail fires all the time, and "clamped to neutral"
# becoming "really reduced to 0.8x" may turn that scenario from beating the baseline into falling behind it. If it really regresses,
# record it as it is and discuss the trade-off; do not revert this coefficient just so that this item "passes" as well.
#
# 5 profiles (b0-stock-cubic/b1-controlled-cubic/bbr-fq/skyline-best/
# skyline-guardrail-neutral) × 7 scenarios × runs=3 = 105 cases, ~1.5-2 hours.
name = "guardrail-gain-ab"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260810
warmup_s = 15
duration_s = 30
runs = 3
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b0-stock-cubic"
kind = "stock-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "bbr-fq"
kind = "bbr"
cc = "bbr"
modules = []

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[profiles]]
id = "skyline-guardrail-neutral"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.0
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[scenarios]]
id = "line-rate"
rtt_ms = 20
rate_mbit = 1000
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.0
loss_direction = "data"
burst_length = 1
parallel = 1

[[scenarios]]
id = "light-loss"
rtt_ms = 80
rate_mbit = 500
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.1
loss_direction = "data"
burst_length = 1
parallel = 1

[[scenarios]]
id = "primary"
rtt_ms = 150
rate_mbit = 500
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.5
loss_direction = "data"
burst_length = 1
parallel = 1

[[scenarios]]
id = "heavy-loss"
rtt_ms = 250
rate_mbit = 100
queue_bdp = 1.0
loss_model = "random"
loss_pct = 2.0
loss_direction = "data"
burst_length = 1
parallel = 1

[[scenarios]]
id = "burst-loss"
rtt_ms = 150
rate_mbit = 500
queue_bdp = 1.0
loss_model = "gemodel"
loss_pct = 0.5
