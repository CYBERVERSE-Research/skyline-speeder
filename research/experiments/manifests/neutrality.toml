# Neutrality recheck. guardrail_gain has been checked against the code: the gain clamp of queue_clamped only happens
# on the two paths with M2 on (skyline_set_cwnd_target) / M4 on (skyline_apply_pacing);
# b2-skyline-base with all modules off never goes through these two functions, so in theory it does not affect this
# neutral baseline; confirming it once with a real test at small cost is more reliable than relying on code reasoning alone.
#
# 3 profiles (b1-controlled-cubic/b2-skyline-base/skyline-best, where skyline-best carries
# rack_rto+guardrail_gain as in target-box.toml) × 4 scenarios (0%~0.5% loss)
# × runs=2 = 24 cases, ~25 minutes.
#
# Acceptance: reuses the existing B1/B2 thresholds of analyze_results.py (in the line-rate scenario, goodput
# difference ±3%, P95 RTT difference ±10%).
name = "neutrality"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260809
warmup_s = 15
duration_s = 30
runs = 2
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "b2-skyline-base"
kind = "skyline"
cc = "skyline_cc"
modules = []

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[scenarios]]
id = "dc-lowrtt"
rtt_ms = 2
rate_mbit = 1000
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.0
loss_direction = "data"
burst_length = 1
parallel = 1

[[scenarios]]
id = "line-rate"
rtt_ms = 20
rate_mbit = 1000
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.0
loss_direction = "data"
burst_length = 1
parallel = 1

[[scenarios]]
id = "light-loss"
rtt_ms = 80
rate_mbit = 500
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.1
loss_direction = "data"
burst_length = 1
parallel = 1

[[scenarios]]
id = "primary"
rtt_ms = 150
rate_mbit = 500
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.5
loss_direction = "data"
burst_length = 1
parallel = 1
