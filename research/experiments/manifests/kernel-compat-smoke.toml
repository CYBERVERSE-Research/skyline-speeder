# Multi-kernel-version compatibility smoke test: KVM form. Mainly correctness/compatibility, not a performance validation:
# no throughput/goodput comparison, no CV threshold, no B1/B2 neutrality, no multi-CC performance
# matrix, no hyperparameter sweep, and not a validation at the level of the target environment grid either.
# `performance_valid=true` is only a schema constraint of the formal-kvm execution_class
# (enforced by validate_manifest in matrix_lib.py); no number from this manifest
# may be written up as a conclusion about algorithm gains.
#
# The scenario shape is copied from the already-validated mechanism smoke setup of retransmit-dscp-mechanism.toml
# (rtt_ms=100/rate_mbit=50/loss_pct=5%/offload=off, short warmup/duration),
# one each for v4/v6, 2 profiles × 2 scenarios = 4 cases, finishing within a few minutes:
#   - compat-cubic-marked: turns on both retransmit_dscp (covers TC retransmission marking) and
#     rack_rto (covers whether the sockops RTO adjustment takes effect: floor_us is set clearly above that path's
#     natural RTO, which should be directly visible in the rto: field of ss -tin), modules=[]
#     does not touch struct_ops, isolating "whether these two mechanisms themselves work on this
#     kernel without skyline_cc".
#   - compat-skyline-full: turns on all 4 modules, verifying that the struct_ops CC stays
#     attached under real load (not just passing --verify-bpf once and then detaching).
name = "kernel-compat-smoke"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260806
warmup_s = 3
duration_s = 8
runs = 1
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_ip6 = "fd20:1::2"
server_data_interface = "data0"

[[profiles]]
id = "compat-cubic-marked"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[profiles.retransmit_dscp]
enabled = true
dscp_value = 10

[profiles.rack_rto]
enabled = true
srtt_permille = 1000
floor_us = 150000
ceiling_us = 200000
warmup_samples = 2
rto_max_normal_permille = 0
rto_max_congested_permille = 0
rto_max_congestion_ratio_permille = 0

[[profiles]]
id = "compat-skyline-full"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[[scenarios]]
id = "compat-smoke-v4"
rtt_ms = 100
rate_mbit = 50
queue_bdp = 1.0
loss_model = "random"
loss_pct = 5.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
capture_retransmits = true
address_family = "v4"

[[scenarios]]
id = "compat-smoke-v6"
rtt_ms = 100
rate_mbit = 50
queue_bdp = 1.0
loss_model = "random"
loss_pct = 5.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
capture_retransmits = true
address_family = "v6"
