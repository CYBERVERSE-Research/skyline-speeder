# Dedicated validation of the RTO cap mechanism. SKYLINE_RTO_MAX_FLOOR_MS=1000 in bpf/skyline_policy.bpf.c
# (milliseconds) clamps the ceiling computed when base_rtt<=~167ms to 1000ms across the board:
# rto_max_normal_permille(3000=3x) and rto_max_congested_permille(6000=6x)
# compute targets below 1000ms anyway in scenarios with rtt_ms<=150, so the two levels are
# numerically indistinguishable, and the core design of this mechanism (switch to a larger multiplier when congestion evidence appears) needs a
# higher-RTT scenario to be really measured.
#
# So this designs a dedicated forced-RTO scenario with rtt_ms=300: at base_rtt≈300ms,
# 3x=900ms and 6x=1800ms, which really separate and are not clamped to the same number by the 1000ms floor.
# The scenario itself follows the approach of rto-max-smoke.toml (Gilbert-Elliott burst loss + low
# bandwidth to shrink the flight window, so the bad state reliably lasts longer than a whole RTT and reliably triggers real
# RTO timeouts instead of RACK taking over early), and keeps the smoke version's
# burst_length=220/duration_s=20/warmup_s=5, already verified not to run out of control, only changing rtt_ms from 150 to 300.
# More aggressive loss-intensity parameters (a larger burst_length/duration_s) would very likely make the profiles without
# a rack_rto cap (stock cubic/bbr/skyline-rto-baseline) trigger
# the cascading-timeout loop of the kernel default rto_max=120s×tcp_retries2=15, actually stalling for
# far longer than the test's own wall-clock budget, so this more conservative set of values is kept.
#
# skyline-rto-baseline is identical to skyline-best except that it omits [profiles.rack_rto],
# equivalent to M1 tier-2 never being activated. The difference skyline-best minus skyline-rto-baseline
# is the marginal effect of this mechanism itself.
#
# The point of the validation is not whether goodput looks good (this mechanism only takes effect in low-probability events in the first place, and its
# effect on overall throughput may be small), but whether the mechanism itself runs as designed. Check
# the existing columns that analyze_results.py already has; no new code is needed:
#   rack_rto_applied>0, rack_rto_max_applied>0 (really called and pushed successfully);
#   rack_rto_max_rejected==0 (not rejected by the kernel);
#   rack_rto_max_congested>0 (the "congestion evidence" branch was indeed observed in this scenario);
#   max_rto_ms clearly below the kernel's 120000ms default, and a discernible difference between skyline-best and
#   skyline-rto-baseline.
#
# 4 profiles (b1-controlled-cubic/bbr-fq/skyline-rto-baseline/skyline-best) ×
# 1 scenario × runs=3 = 12 cases, ~15-20 minutes.
name = "rto-max-validation"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260812
warmup_s = 5
duration_s = 20
runs = 3
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "bbr-fq"
kind = "bbr"
cc = "bbr"
modules = []

[[profiles]]
id = "skyline-rto-baseline"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[scenarios]]
id = "forced-rto-burst-rtt300"
rtt_ms = 300
rate_mbit = 15
queue_bdp = 1.0
loss_model = "gemodel"
loss_pct = 8.0
loss_direction = "data"
burst_length = 220
parallel = 1
offload = "off"
