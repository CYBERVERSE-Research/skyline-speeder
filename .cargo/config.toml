# Built on a musl host (Alpine), link the binaries dynamically, the way every
# other program on that host is linked. Rust's musl targets link statically by
# default, and then the -lz libbpf-sys asks for needs zlib's static archive,
# which Alpine keeps in zlib-static, a package nothing installs: the link fails
# with `cannot find -lz` (measured on Alpine 3.23). Inert on glibc hosts, the
# release build included. RUSTFLAGS in the environment replaces this.
[target.'cfg(target_env = "musl")']
rustflags = ["-C", "target-feature=-crt-static"]
