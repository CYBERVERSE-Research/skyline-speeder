# Continuous integration.
#
# What CI can and cannot do for this project, stated plainly because it changes
# how you should read a green check mark:
#
#   CAN   compile the three CO-RE BPF objects, build and test the Rust control
#         plane, lint the shell scripts, run the experiment-harness unit tests.
#   CANNOT load any BPF object. GitHub runners do not run a 6.12+ kernel and the
#         four-argument `cong_control` signature skyline_cc depends on does not
#         exist below 6.10, so the verifier would reject it for reasons that say
#         nothing about the change under review.
#   CANNOT produce performance numbers. Those come only from the two-VM test bed
#         described in research/experiments/README.md.
#
# The real gate stays local and is stated in CONTRIBUTING.md:
#   skyline-speederd --config config/speeder.toml --validate-only --verify-bpf
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, check, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # libbpf-rs builds libbpf-sys, which needs libelf and zlib headers and a
      # C toolchain. pkg-config is how it finds them.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config clang llvm \
            libbpf-dev libelf-dev zlib1g-dev

      # rust-toolchain.toml pins the channel; rustup honours it automatically.
      - name: Show toolchain
        run: cargo --version && rustc --version && cargo fmt --version

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Static check
        run: cargo check --workspace --all-targets

      - name: Unit tests
        run: cargo test --workspace

  bpf:
    name: BPF (CO-RE compile only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and libbpf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev libelf-dev zlib1g-dev

      # bpftool is only needed to dump the kernel's BTF into vmlinux.h.
      #
      # Do NOT use Ubuntu's `bpftool` package: it ships a wrapper script from
      # linux-tools-common that dispatches to a real binary matching `uname -r`.
      # Runner kernels have no matching linux-tools package in the archive, so
      # the wrapper lands on PATH, satisfies `command -v`, and only then fails at
      # run time with "WARNING: bpftool not found for kernel 6.17.0-1022" and a
      # non-zero exit. Presence is not usability; this job was red for exactly
      # that reason.
      #
      # The upstream static build has no kernel coupling and is pinned by digest.
      - name: Install bpftool (upstream static build)
        env:
          BPFTOOL_VERSION: v7.7.0
          BPFTOOL_SHA256: 09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c
        run: |
          set -euo pipefail
          url="https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/bpftool.tar.gz "$url"
          echo "${BPFTOOL_SHA256}  /tmp/bpftool.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/bpftool.tar.gz -C "$HOME/.local/bin" bpftool
          chmod +x "$HOME/.local/bin/bpftool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Run it. This is the check the previous `command -v` guard lacked.
          "$HOME/.local/bin/bpftool" version

      # CO-RE needs a kernel BTF to generate vmlinux.h from. A missing one is
      # now a hard failure rather than a skip: with bpftool pinned, BTF is the
      # only remaining infrastructure dependency, and a check that silently
      # stops running is worse than one that goes red and gets looked at.
      - name: Compile CO-RE objects
        run: |
          set -euo pipefail
          if [ ! -r /sys/kernel/btf/vmlinux ]; then
            echo "::error::/sys/kernel/btf/vmlinux is absent on this runner; CO-RE objects cannot be compiled"
            exit 1
          fi
          bpftool version
          make bpf BPFTOOL="$(command -v bpftool)"
          ls -l build/bpf/

      # An object without .BTF.ext carries no CO-RE relocation records, which
      # would mean its field offsets are baked in and it only works on the
      # kernel it was compiled against. Shipping prebuilt objects depends on
      # this section existing, so assert it rather than assume it.
      - name: Assert CO-RE relocations are present
        run: |
          set -euo pipefail
          for object in build/bpf/*.bpf.o; do
            if readelf -S "$object" | grep -q '\.BTF\.ext'; then
              echo "ok   $object carries .BTF.ext"
            else
              echo "::error::$object has no .BTF.ext section; it is not CO-RE relocatable"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bpf-objects-${{ github.sha }}
          path: build/bpf/*.bpf.o
          if-no-files-found: error
          retention-days: 14

      - name: Note what was not checked
        run: |
          {
            echo "### BPF objects compiled, not loaded"
            echo
            echo "Runner kernel: \`$(uname -r)\`. skyline_cc needs 6.12 LTS or newer to load."
            echo "Run the verifier locally before merging:"
            echo
            echo '```'
            echo "skyline-speederd --config config/speeder.toml --validate-only --verify-bpf"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  shell:
    name: Shell (shellcheck, syntax)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Severity warning and above. Repository-wide exclusions, with the reason
      # each one is a false positive here, live in .shellcheckrc.
      - name: shellcheck
        run: |
          shellcheck -S warning install.sh scripts/*.sh infra/*.sh \
            infra/kernel/*.sh research/experiments/*.sh

      - name: Syntax
        run: bash -n install.sh scripts/*.sh infra/*.sh infra/kernel/*.sh research/experiments/*.sh

  python:
    name: Experiment harness (unit tests)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: research/experiments/matrix_lib.py imports tomllib,
        # which entered the standard library in 3.11.
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/experiments/tests -v
