# Release pipeline: build the artifacts a user installs with
# `install.sh --prebuilt`, so that installing needs no clang, no LLVM, no
# bpftool and no Rust toolchain on the target machine. Two of them, one per C
# library: the glibc build, and the musl build Alpine takes (-musl). They carry
# the same BPF objects -- the same files, built once -- and differ in bin/.
#
# The objects are compiled against a PINNED REFERENCE HEADER generated from the
# oldest supported kernel (6.12 LTS), not against whatever kernel this runner
# happens to boot. CO-RE fixes field offsets at load time, but it cannot
# conjure a field that does not exist: an object compiled against a newer
# kernel's types can reference something added after 6.12 and then fail to load
# there. A field present in 6.12 is still present in 6.19; the reverse does not
# hold. See infra/kernel/make-reference-vmlinux.sh, which generates the header,
# and infra/kernel/core-portability.sh, which checks the resulting objects load
# on a kernel other than the one they were built against.
#
# Because the header is supplied, this job needs no bpftool and no
# /sys/kernel/btf/vmlinux at all.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # A tag that disagrees with the crate version would publish binaries whose
      # `--version`, and the version in `ssctl status`, name another release --
      # and install.sh reports upgrades from exactly that string. Catch it here,
      # before anything is built, rather than on a host after the fact.
      - name: Check the tag against the crate version and CHANGELOG.md
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "skyline-speederd") | .version')
          if [ -z "$VERSION" ]; then
            echo "::error::could not read the skyline-speederd version from cargo metadata"
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match the workspace version $VERSION: tag v$VERSION, or bump [workspace.package] version in Cargo.toml first"
            exit 1
          fi
          if ! awk -v h="## [$VERSION]" 'index($0, h) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section; add the release notes before tagging"
            exit 1
          fi
          echo "tag $TAG matches skyline-speederd $VERSION and CHANGELOG.md"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config clang llvm \
            libbpf-dev libelf-dev zlib1g-dev

      # Refusing rather than falling back to the runner's own BTF is deliberate.
      # A silent fallback would produce objects compiled against a 6.17+ kernel
      # and ship them to 6.12 users, which is the exact failure this pipeline
      # exists to avoid -- and it would fail at their load time, not ours.
      - name: Fetch the pinned reference vmlinux.h
        env:
          REFERENCE_URL: ${{ vars.SKYLINE_REFERENCE_VMLINUX_URL }}
          REFERENCE_SHA256: ${{ vars.SKYLINE_REFERENCE_VMLINUX_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${REFERENCE_URL:-}" ] || [ -z "${REFERENCE_SHA256:-}" ]; then
            echo "::error::SKYLINE_REFERENCE_VMLINUX_URL and SKYLINE_REFERENCE_VMLINUX_SHA256 must both be set as repository variables. Generate the header with infra/kernel/make-reference-vmlinux.sh on a 6.12 host, publish it, and point these at it."
            exit 1
          fi
          curl -fsSL --proto '=https' --tlsv1.2 -o reference.h.gz "$REFERENCE_URL"
          echo "${REFERENCE_SHA256}  reference.h.gz" | sha256sum -c -
          gunzip -c reference.h.gz > reference-vmlinux.h
          grep -q 'preserve_access_index' reference-vmlinux.h \
            || { echo "::error::reference header lacks the preserve_access_index pragma; objects built from it would not be CO-RE relocatable"; exit 1; }
          echo "reference header: $(wc -l < reference-vmlinux.h) lines"

      - name: Build BPF objects against the reference header
        run: make bpf PREBUILT_VMLINUX_H="$PWD/reference-vmlinux.h"

      - name: Assert CO-RE relocations are present
        run: |
          set -euo pipefail
          for object in build/bpf/*.bpf.o; do
            readelf -S "$object" | grep -q '\.BTF\.ext' \
              || { echo "::error::$object has no .BTF.ext section"; exit 1; }
            echo "ok   $object"
          done

      # --locked: build exactly the dependency versions Cargo.lock records. CI
      # checks and tests with --locked too, so a stale lock fails there first.
      - name: Build the control plane
        run: cargo build --workspace --release --locked

      # The same control plane against musl, in an Alpine 3.21 container, and
      # then run in clean Alpine containers that have only the libraries
      # install.sh installs for it: infra/build-musl.sh says why each. A step
      # that starts a container, not a container job: JavaScript actions --
      # checkout, the release upload -- do not run inside Alpine.
      - name: Build the control plane for musl (Alpine)
        run: infra/build-musl.sh

      # Layout matches what infra/install-prebuilt-guest.sh already expects, so
      # the test bed and `install.sh --prebuilt` consume the same tarball rather
      # than two shapes that drift apart. The musl build is named
      # -<arch>-musl, the suffix after the architecture: installers up to
      # v0.4.0 take the first asset matching -<arch>.tar.gz, and must never
      # land on it. The OpenRC scripts travel in both, beside the units.
      - name: Assemble the artifacts
        id: assemble
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REFERENCE_SHA256: ${{ vars.SKYLINE_REFERENCE_VMLINUX_SHA256 }}
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          # The commit checked out, which a workflow_dispatch of an older tag
          # makes different from the commit the run was started from.
          COMMIT=$(git rev-parse HEAD)
          assemble() {
            local name=$1 bin=$2 libc=$3 built_in=$4
            mkdir -p "$name"/{bin,bpf,config,packaging/openrc,infra}
            install -m 0755 "$bin/skyline-speederd" "$bin/ssctl" "$name/bin/"
            install -m 0644 build/bpf/*.bpf.o "$name/bpf/"
            # speeder-guest.toml, not speeder.toml: the dev config has a
            # relative bpf_dir (build/bpf) that only resolves inside a source
            # tree, and an installed daemon would look for objects that are not
            # there. This is the same file install-guest.sh puts in place for a
            # source install.
            install -m 0644 config/speeder-guest.toml "$name/config/speeder.toml"
            install -m 0644 packaging/*.service "$name/packaging/"
            install -m 0755 packaging/openrc/skyline-speederd \
              packaging/openrc/skyline-speeder-enable "$name/packaging/openrc/"
            install -m 0755 infra/boot-enable.sh infra/boot-disable.sh \
              infra/run-in-skyline-cgroup.sh infra/apply-guest-profile.sh \
              infra/collect-guest-metrics.sh infra/snapshot-skyline-events.sh "$name/infra/"

            # Provenance travels with the artifact. Without it nobody can tell,
            # months later, which kernel's types these objects were built
            # against -- which is the one fact that decides whether they load.
            # libc= is what install.sh checks an artifact against its host by.
            {
              printf '%s\n' "tag=${TAG}" "commit=${COMMIT}" "arch=${ARCH}" "libc=${libc}" \
                "built_in=${built_in}" "built_on_runner_kernel=$(uname -r)" \
                "reference_vmlinux_sha256=${REFERENCE_SHA256}" \
                "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              sha256sum "$name"/bin/* "$name"/bpf/*.bpf.o
            } > "$name/MANIFEST"

            tar -czf "${name}.tar.gz" "$name"
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
            cat "${name}.tar.gz.sha256"
          }

          GLIBC="skyline-speeder-${TAG}-${ARCH}"
          MUSL="${GLIBC}-musl"
          assemble "$GLIBC" target/release glibc \
            "$(. /etc/os-release && echo "$PRETTY_NAME"), glibc $(getconf GNU_LIBC_VERSION | awk '{print $2}'), $(rustc --version)"
          assemble "$MUSL" target/musl/release musl "$(cat target/musl/BUILT_IN)"

          # One set of objects in both, as the steps above promise.
          for object in "$GLIBC"/bpf/*.bpf.o; do
            cmp "$object" "$MUSL/bpf/${object##*/}"
          done
          echo "glibc=${GLIBC}" >> "$GITHUB_OUTPUT"
          echo "musl=${MUSL}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.assemble.outputs.glibc }}.tar.gz
            ${{ steps.assemble.outputs.glibc }}.tar.gz.sha256
            ${{ steps.assemble.outputs.musl }}.tar.gz
            ${{ steps.assemble.outputs.musl }}.tar.gz.sha256
          fail_on_unmatched_files: true
          body: |
            Prebuilt artifacts, one per C library. The one-line install takes the
            right one by itself; from a source tree, install without a build toolchain:

            ```
            sudo ./install.sh --prebuilt   # on Alpine, as root: ./install.sh --prebuilt
            ```

            | Artifact | For | Needs |
            |---|---|---|
            | `skyline-speeder-${{ github.event.inputs.tag || github.ref_name }}-x86_64.tar.gz` | glibc: Debian, Ubuntu, Fedora, the RHEL family | glibc 2.38 or newer with `libelf.so.1` and `libz.so.1` (Debian 13, Ubuntu 24.04, Fedora 43, Rocky Linux 10 and later); built on Ubuntu 24.04 |
            | `skyline-speeder-${{ github.event.inputs.tag || github.ref_name }}-x86_64-musl.tar.gz` | musl: Alpine | Alpine 3.21 or newer (musl 1.2.5) with `libelf`, `zlib`, `zstd-libs` and `libgcc`, which the installer adds; built in Alpine 3.21 |

            Both carry the same three BPF objects, byte for byte. They were compiled
            against a pinned reference `vmlinux.h` generated from a 6.12 LTS kernel, so
            they load on 6.12 and newer. `MANIFEST` inside each tarball records the
            provenance, the C library, and the digest of every shipped binary and object.

            Kernel 6.12 LTS or newer is still required, and `/sys/kernel/btf/vmlinux`
            must be present: CO-RE resolves field offsets against it at load time.

            On older userspace, such as Debian 12 (glibc 2.36) with a backports kernel,
            the installer builds from source instead.

            Upgrading a host that already runs Skyline Speeder: run the new `install.sh`
            the same way the host was installed. It checks the new objects with the
            kernel verifier first and then restarts `skyline-speederd` itself: live flows
            are drained for up to 60 s and skyline_cc is attached again. That includes a
            host where skyline_cc was attached by hand with `sudo ssctl enable` rather
            than by `skyline-speeder-enable.service`: the installer drains it before the
            restart and attaches it again afterwards (with `--no-enable`, by hand as
            before, so not at boot). This works on hosts installed with 0.2.0 or earlier
            too, since what matters is the `install.sh` that runs, not the version it
            replaces:

            ```
            sudo ./install.sh --prebuilt   # add --no-enable if the host was installed with it
            ```

            Settings made with `ssctl` live only in the daemon's memory and do not carry
            over the restart; the installer writes the old `ssctl status` into
            `/var/log/skyline-speeder-install.log`. The release's section of
            `CHANGELOG.md` has the full upgrade notes.
