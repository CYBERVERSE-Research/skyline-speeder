[workspace]
members = [
    "crates/skyline-common",
    "crates/skyline-speederd",
    "crates/ssctl",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
version = "0.2.0"
license = "GPL-2.0-only"

[workspace.dependencies]
anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "=4.5.4", features = ["derive"] }
libbpf-rs = "0.24"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
serde_json = "1"
thiserror = "2"
toml = "0.8"
